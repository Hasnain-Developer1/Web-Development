<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacking</title>
    <style>
        body {
            background-color: black;
            color: green;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <!-- create a hacking simulator which has green background and it shows these messages with the random delay of 1 to 7 seconds:
    inilializing hacking...
    Reading your files...
    Password Files detected....
    Sending all passwords and personal files to the server...
    Cleaning up....

    These three dots musts blink sp that it look like a real terminal.
    -->
    <script>

        const additem = async (item) => {
            await randomDelay()
            let div = document.createElement("div")
            div.innerHTML = item
            document.body.append(div)
        }
        const randomDelay = () => {
            timeout = 1 + 6 * Math.random()
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve()
                }, timeout * 1000);
            })
        }

        async function main() {

            setInterval(() => {
                let last = document.body.getElementsByTagName("div")
                last = last[last.length-1]
                if(last.innerHTML.endsWith("...")){
                    last.innerHTML = last.innerHTML.slice(0, last.innerHTML.length - 3)
                }
                else{

                    last.innerHTML = last.innerHTML + "."
                }
            }, 100);


            let text = [">>>inilializing hacking",
                ">>>Reading your files",
                ">>>Password Files detected",
                ">>>Sending all passwords and personal files to the server",
                ">>>Cleaning up",]

            for (const item of text) {
                await additem(item)
            }

        }
        main()
    </script>
</body>

</html>
