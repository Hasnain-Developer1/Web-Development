<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object-fit and Object-cover</title>
    <style>
        .container{
            height: 488px;
            width: 466px;
            border: 2px solid black;
            /* background-color: azure; */
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBUk0LR5QeojHCkKau8sm4_c8fLSW7vgs0sg&s");
            background-position: top right;
            background-repeat: repeat-y;
            background-clip: border-box;
        }
        img{
            height: 488px;
            width: 466px;
            object-fit: contain;
            /* object-fit: scale-down; */
            /* object-fit: cover; */
            object-position: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <img src="https://www.mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" alt=""> -->
    </div>
</body>
</html>
