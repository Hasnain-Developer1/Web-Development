    <style>
        .navbar {
            border: 2px solid black;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 20px;
            background-color: rgb(253, 253, 253);
            position: sticky;
            top: 0px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .left,
        .center,
        .right {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        li {
            list-style: none;
        }

        .dwnld {
            background-color: rgb(245, 214, 87);
            padding: 5px;
            border-radius: 10px;
            cursor: pointer;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 1200px;
            margin: 0 auto;
            gap: 25px;
        }

        .boxes {
            border-radius: 10px;
            background-color: white;
            padding: 30px;
            display: flex;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            transition: transform 0.2s ease-in-out;
        }

        .boxes button {
            padding: 10px;
            border-radius: 10px;
            background-color: #5cb85c;
            cursor: pointer;
        }

        .boxes:hover {
            transform: translateY(-5px);
        }

        .boxes button:hover {
            background-color: #4cae4c;
            transform: scale(1.05);
            transition: all 0.2s ease-in-out;
        }

        @media screen and (max-width: 950px) {
            .container {
                display: grid;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
