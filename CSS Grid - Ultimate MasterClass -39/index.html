<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100vh;
            width: 80vw;
            border: 2px solid black;
            display: grid;
            /* grid-template-columns: [pahla]120px [dosra]100px [t]; */
            grid-template-columns: repeat(4, minmax(100px, 1fr));
            justify-items: center;
            row-gap: 10px;
            column-gap: 44px;
            /* justify-items: center;
            align-items: center; */
            place-items: center;
            
        }
        .items{
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }
        .item4{
            /* grid-row: 1/2; */
            /* grid-column: pahla/t; */
            /* align-self: flex-start;
            justify-self: end; */
        }
        .item1{
            /* grid-row: 1/2; */
            /* agr ya na likho to ya likho */
            grid-row-start: 1/2;
            grid-row-end: 1/2;
            grid-column: 1/2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item1">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items item4">4</div>
        <div class="items">5</div>
    </div>
</body>
</html>
