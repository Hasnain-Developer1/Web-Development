<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: relative;
            background-color: blue;
            height: 80vh;
            width: 80vw;
        }
        .ball{
            animation: animatex 3s  linear infinite, animatey 1s ease-out infinite alternate;
            background-color: red;
            height: 80px;
            width: 80px;
            position: absolute;
            border-radius: 90%;
            bottom: 0;
            left: 0;

        }
        @keyframes animatex {
            from{
                left: 0;
            }
            to{
                left: calc(100% -  80px);
            }
            
        }
        @keyframes animatey {
            from{
                bottom: 0;
            }
            to{
                bottom: calc(100% - 80px);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="ball">

        </div>
    </div>
</body>
</html>
